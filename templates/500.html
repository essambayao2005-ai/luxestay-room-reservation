{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 - System Error | MSU-SND Room Reservation</title>
  <link rel="icon" type="image/png" href="{% static 'img/msu_logo.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">
  <!-- Ambient background shapes -->
  <div class="ambient-background-layer" aria-hidden="true">
    <div class="ambient-blob ambient-blob-1"></div>
    <div class="ambient-blob ambient-blob-2"></div>
  </div>

  <div class="glass-card empty-state-panel p-5 text-center position-relative" style="max-width: 540px; z-index: 10;">
    <div class="sidebar-logo-chip mx-auto mb-3" style="width: 64px; height: 64px;">
      <img src="{% static 'img/msu_logo.png' %}" alt="MSU-SND Logo" class="sidebar-logo-img">
    </div>
    <div class="empty-state-icon mx-auto" style="background-color: var(--status-conflict-bg); color: var(--status-conflict-text);">
      <i class="bi bi-exclamation-triangle"></i>
    </div>
    <h1 class="empty-state-title">500 - Server Internal Error</h1>
    <p class="empty-state-desc">
      An unexpected internal exception occurred while processing your request. Please try again or return to the room directory.
    </p>
    <div class="d-flex gap-3 justify-content-center mt-3">
      <a href="/" class="btn btn-maroon">
        <i class="bi bi-arrow-left"></i> Return to Rooms
      </a>
    </div>
  </div>
</body>
</html>
