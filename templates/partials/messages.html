{% if messages %}
<div class="toast-container-custom" aria-live="polite">
  {% for message in messages %}
    <div class="custom-alert custom-alert-{{ message.tags|default:'info' }}" role="alert">
      <i class="bi {% if message.tags == 'success' %}bi-check-circle-fill{% elif message.tags == 'error' or message.tags == 'danger' %}bi-exclamation-circle-fill{% elif message.tags == 'warning' %}bi-exclamation-triangle-fill{% else %}bi-info-circle-fill{% endif %}"></i>
      <div class="flex-grow-1">{{ message }}</div>
    </div>
  {% endfor %}
</div>
{% endif %}
