{% load static %}
<!DOCTYPE html>
<html lang="en"
      data-auth-bg="{% static 'img/msu_bg.jpg' %}"
      data-skip-intro="{% if form.errors %}1{% else %}0{% endif %}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MSU-SND Room Reservation{% endblock %}</title>

  <link rel="icon" type="image/png" href="{% static 'img/msu_logo.png' %}">
  <link rel="preload" as="image" href="{% static 'img/msu_bg.jpg' %}">

  <!-- Prevent flash of final state before intro starts (no-JS stays visible) -->
  <script>
    (function () {
      var root = document.documentElement;
      var skip = root.getAttribute('data-skip-intro') === '1';
      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var played = false;
      try { played = sessionStorage.getItem('msu_auth_intro_done') === '1'; } catch (e) {}
      if (!skip && !reduced && !played) {
        root.classList.add('auth-intro-pending');
      }
    })();
  </script>

  <!-- Inter Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3.3 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Campus Design System -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=2">
</head>
<body>
  <!-- Static blurred full-screen MSU background -->
  <div class="auth-bg" style="background-image: url('{% static 'img/msu_bg.jpg' %}');" aria-hidden="true"></div>
  <div class="auth-overlay" aria-hidden="true"></div>

  <main class="auth-shell">
    <!-- Brand Block -->
    <div class="auth-brand">
      <div class="auth-logo-chip {% block logo_chip_class %}auth-logo-chip--login{% endblock %}">
        <img src="{% static 'img/msu_logo.png' %}" alt="MSU-SND Logo">
      </div>
      <h1 class="auth-brand-title">MSU-SND</h1>
      <p class="auth-brand-caption">Room Checker and Reservation System</p>
    </div>

    <!-- Centered Frosted Glass Card -->
    <div class="auth-card {% block card_class %}auth-card--login{% endblock %}">
      {% block card_content %}{% endblock %}
    </div>

    <!-- Footer -->
    <p class="auth-footer">Mindanao State University - Sultan Naga Dimaporo</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="{% static 'js/auth.js' %}?v=2"></script>
</body>
</html>
